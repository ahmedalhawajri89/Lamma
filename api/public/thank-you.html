<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>تمّت الكفالة | كفالة</title>
  <meta name="description" content="تم تفعيل كفالتك بنجاح.">
  <meta name="theme-color" content="#c2410c">

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
  <!-- الأصل نفسه. اضبطها على "off" ليعمل الموقع ساكناً بلا خادم. -->
  <meta name="api-base" content="">

  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap">

  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <script type="module" src="assets/js/main.js"></script>
</head>

<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى الرئيسي</a>

  <main id="main" class="thanks">
    <div class="thanks__card" id="thanksCard">

      <div class="thanks__seal">
        <i class="fa-solid fa-heart" aria-hidden="true"></i>
      </div>

      <h1 style="font-size:var(--text-2xl)">
        تمّت الكفالة. صار لـ<span data-thanks="name">…</span> من يقف معه.
      </h1>

      <p class="section-lede">
        جعله الله في ميزان حسناتك. سيصلك أول تقرير مصوّر خلال تسعين يوماً،
        وتستطيع متابعة كل شيء من لوحتك في أي وقت.
      </p>

      <div class="thanks__ref">
        <img data-thanks="photo" src="assets/img/orphan-omnia.webp" alt="" width="52" height="52">
        <div>
          <strong data-thanks="name">…</strong>
          <div class="field__hint">
            <span data-thanks="program">…</span> ·
            <span class="num" data-thanks="price">…</span> شهرياً ·
            مرجع <span class="num" data-thanks="ref">…</span>
          </div>
        </div>
      </div>

      <p class="field__hint">
        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
        أرسلنا تأكيداً وإيصالاً رسمياً إلى بريدك الإلكتروني.
      </p>

      <div class="cluster cluster--center" style="width:100%">
        <a class="btn btn--primary btn--lg" href="dashboard.html">
          افتح لوحتي
          <i class="fa-solid fa-arrow-left btn__icon btn__icon--arrow" aria-hidden="true"></i>
        </a>
        <a class="btn btn--outline btn--lg" href="orphans.html">اكفل طفلاً آخر</a>
      </div>

      <a class="link-arrow" href="index.html">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        العودة للرئيسية
      </a>

    </div>
  </main>
</body>
</html>
