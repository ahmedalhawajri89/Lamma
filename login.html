<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="shortcut icon" href="assests/img/6144-removebg-preview.png" type="image/x-icon">
  
  <!-- Modern Design System -->
  <link rel="stylesheet" href="assests/css/main-ui.css">
  
  <title>تسجيل الدخول - كفالة</title>
</head>
<body>

  <div class="kfl-auth-wrapper">
    
    <!-- Image Side (Right in RTL naturally visually if flex is row-reverse, but we just use flex) -->
    <div class="kfl-auth-image-side">
      <img src="assests/img/hero-bg-modern.png" alt="كفالة يتيم" class="kfl-auth-img">
      <div class="kfl-auth-image-content">
        <h2>كل عطاء يصنع فارقاً</h2>
        <p>مرحباً بعودتك إلى منصة كفالة، حيث تستمر رحلتك في صناعة الأمل ورسم البسمة على وجوه الأيتام حول العالم.</p>
      </div>
    </div>

    <!-- Form Side -->
    <div class="kfl-auth-form-side">
      <div class="kfl-auth-form-container">
        
        <div class="kfl-auth-logo">
          <a href="index.html">
            <img src="assests/img/6144-removebg-preview.png" alt="شعار كفالة">
          </a>
        </div>

        <div class="kfl-auth-header">
          <h1 class="kfl-auth-title">تسجيل الدخول</h1>
          <p class="kfl-auth-subtitle">مرحباً بعودتك! أدخل تفاصيل حسابك للوصول للوحة التحكم.</p>
        </div>

        <div class="kfl-social-logins">
          <button class="kfl-social-btn">
            <i class="fa-brands fa-google" style="color: #DB4437; font-size: 1.2rem;"></i> Google
          </button>
          <button class="kfl-social-btn">
            <i class="fa-brands fa-apple" style="color: #000; font-size: 1.2rem;"></i> Apple
          </button>
        </div>

        <div class="kfl-auth-divider">أو عبر البريد الإلكتروني</div>

        <form action="user-dashboard.html" method="GET">
          <div class="kfl-form-group">
            <label class="kfl-label" for="email">البريد الإلكتروني</label>
            <div class="kfl-input-wrapper">
              <input type="email" id="email" class="kfl-input" placeholder="name@example.com" required>
              <i class="fa-regular fa-envelope kfl-input-icon"></i>
            </div>
          </div>

          <div class="kfl-form-group">
            <label class="kfl-label" for="password">كلمة المرور</label>
            <div class="kfl-input-wrapper">
              <input type="password" id="password" class="kfl-input" placeholder="••••••••" required>
              <i class="fa-solid fa-lock kfl-input-icon"></i>
              <button type="button" class="kfl-password-toggle" onclick="togglePassword('password', this)">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="kfl-auth-links">
            <label class="kfl-checkbox-group">
              <input type="checkbox" checked>
              <span>تذكرني</span>
            </label>
            <a href="#">نسيت كلمة المرور؟</a>
          </div>

          <button type="submit" class="kfl-btn kfl-btn-primary kfl-btn-block">تسجيل الدخول</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; color: var(--kfl-gray-600);">
          ليس لديك حساب؟ <a href="register.html" style="font-weight: 600;">إنشاء حساب جديد</a>
        </p>

      </div>
    </div>

  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>

</body>
</html>
