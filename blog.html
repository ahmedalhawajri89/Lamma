<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>المدونة | كفالة</title>
  <meta name="description" content="نكتب عن آلية عملنا وقراراتنا وأخطائنا: الشفافية، سياسات الحماية، قصص الأطفال، وتقارير الحملات.">
  <meta name="theme-color" content="#c2410c">

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="canonical" href="blog.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap">

  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <script type="module" src="assets/js/main.js"></script>
</head>

<body data-header="solid" class="page-body">
  <div data-layout="header"></div>

  <main id="main">

    <section class="page-hero">
      <div class="glow" aria-hidden="true"></div>
      <div class="container">
        <div class="page-hero__inner">
          <nav aria-label="مسار التنقل">
            <ol class="breadcrumb">
              <li><a href="index.html">الرئيسية</a></li>
              <li><span aria-current="page">المدونة</span></li>
            </ol>
          </nav>
          <span class="eyebrow">المدونة</span>
          <h1 class="page-hero__title">نكتب عن عملنا، لا عن أنفسنا</h1>
          <p class="page-hero__lede">
            كيف نتحقق من الحالات، ولماذا نرفض بعضها، وما الذي أخفقنا فيه.
            هذه مدونة عمل، لا نشرة علاقات عامة.
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="sr-only">أحدث المقالات</h2>
        <div class="grid grid--auto-lg" id="postsGrid"></div>

        <div class="text-center" style="margin-block-start:var(--space-12)">
          <button class="btn btn--outline btn--lg" type="button">
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            تحميل مقالات أقدم
          </button>
        </div>
      </div>
    </section>

    <!-- النشرة -->
    <section class="section section--surface">
      <div class="container container--narrow">
        <div class="card" style="padding:clamp(var(--space-6),4vw,var(--space-12));align-items:center;text-align:center" data-reveal>
          <div class="icon-box icon-box--accent icon-box--soft">
            <i class="fa-regular fa-envelope-open" aria-hidden="true"></i>
          </div>
          <h2 style="font-size:var(--text-xl)">رسالة واحدة كل شهر</h2>
          <p class="card__text">
            ملخّص ما أنجزناه، وما صرفناه، وقصة طفل واحد. بلا إلحاح ولا حملات،
            ويمكنك إلغاء الاشتراك بنقرة.
          </p>

          <form class="newsletter" data-validate-form
                data-success-message="تم اشتراكك، ستصلك أول رسالة مطلع الشهر" novalidate>
            <div class="field" style="flex:1">
              <label class="sr-only" for="newsletterEmail">البريد الإلكتروني</label>
              <div class="field__control">
                <input class="input" type="email" id="newsletterEmail" name="email"
                       placeholder="بريدك الإلكتروني" autocomplete="email"
                       data-validate="required|email" aria-describedby="err-newsletter">
              </div>
              <p class="field__error" id="err-newsletter" role="alert"></p>
            </div>
            <button class="btn btn--primary" type="submit">اشترك</button>
          </form>
        </div>
      </div>
    </section>

  </main>

  <div data-layout="footer"></div>

  <button class="to-top" type="button" id="toTop" aria-label="العودة إلى أعلى الصفحة">
    <svg class="to-top__ring" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="25"></circle></svg>
    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
  </button>
</body>
</html>
